listeners:
  - query_port: 8888
    motd: 'Eaglercraft 26.3 Bridge'
    tab_list: GLOBAL_PING
    query_enabled: false
    proxy_protocol: false
    ping_passthrough: false
    priorities:
      - target_server # Must match the name in the servers section below
    bind_local_address: true
    host: 0.0.0.0:8888 # CRITICAL: Binder only exposes port 8888 to the web
    max_players: 20
    tab_size: 60
    force_default_server: true

online_mode: false # Must be false to allow web clients to connect
ip_forward: true   

servers:
  target_server:
    motd: 'The real server I want to play on'
    address: <TARGET_SERVER_IP>:<PORT> # Replace with the actual server IP you want to join
    restricted: false
